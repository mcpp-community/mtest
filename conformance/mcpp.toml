# The conformance suite of the mtest protocol (../spec/protocol.md): each case
# names the clause it checks. It runs an implementation of the protocol's
# program side under the protocol's variables and reads what it reports. The
# implementation under test is the command MTEST_CTS_PROGRAM names (a program and its
# arguments, separated by spaces), by
# default this package's fixture (mcpplibs.mtest); the adapters and the C ABI
# provide fixtures of the same cases, so one suite checks every implementation.
[package]
namespace   = "mcpplibs.mtest"
name        = "conformance"
version     = "0.6.0"
description = "The conformance suite of the mtest protocol, for every implementation of its program side"
license     = "Apache-2.0"

[language]
standard   = "c++23"
modules    = true
import_std = true

[build]
sources = ["src/*.cppm", "src/*.cpp"]

# The fixture is linked keeping only what it reaches, as `mcpp test` links a
# test program: the marker (P2.3) survives that link.
[target.linux.build]
cxxflags = ["-ffunction-sections", "-fdata-sections"]
ldflags  = ["-Wl,--gc-sections"]

# The fixture: the same cases every implementation provides (spec/conformance.md).
[targets.fixture]
kind = "bin"
main = "src/fixture.cpp"

[dependencies]
mcpplibs.mtest = { path = "../lib" }
mcpplibs.os    = "^0.4.1"
nlohmann.json  = "3.12.0"
