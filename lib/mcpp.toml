# mcpplibs.mtest: the C++ test library of mtest. Cases, expectations, fixtures,
# parameters and attributes, with no macro and no header; a program built with it
# speaks the mtest protocol (../spec/protocol.md) at level 3 when a runner asks,
# and prints a short report to its terminal when none does.
#
#   import mcpplibs.mtest;
#   using namespace mcpplibs::mtest;
#   int main() {
#       "adds"_test = [] { expect(eq(1 + 1, 2)); };
#       return report();
#   }
#
# The modules `mcpplibs.mtest.bench`, `mcpplibs.mtest.cts` and `mcpplibs.mtest.e2e`
# add measurements, conformance clauses and programs under test. The operating
# system is reached through mcpplibs.os only, so the library builds for every
# target its user builds for, an ok image included.
[package]
namespace   = "mcpplibs"
name        = "mtest"
version     = "0.8.3"
description = "The C++ test library of mtest: cases, expectations, fixtures, bench, conformance and end-to-end helpers, with no macro and no header, speaking the mtest protocol"
license     = "Apache-2.0"
authors     = ["mcpp-community"]
repo        = "https://github.com/mcpp-community/mtest"
mcpp        = ">=2026.11.7.2"

[language]
standard   = "c++23"
modules    = true
import_std = true

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[targets.mtest]
kind = "lib"

# The three modules beside the root are its users (each re-exports it), so the root cannot
# re-export them; a module is public when the lib root or an enabled feature brings it (mcpp
# SPEC-008), and each is a feature, on by default. A program that imports one of them builds
# against the packed library as from source.
[features]
default = ["e2e", "bench", "cts"]
e2e     = { sources = ["src/e2e.cppm", "src/e2e.cpp"] }
bench   = { sources = ["src/bench.cppm", "src/bench.cpp"] }
cts     = { sources = ["src/cts.cppm", "src/cts.cpp"] }

# The `main` of a test program whose files only declare suites. mcpp 2026.11.8.1 and later begin
# such a file here by itself (`test-main`) and know it speaks the protocol (`test-protocol`); an
# earlier mcpp is told `[test] main = { from = "mtest/main" }`.
[targets.main]
kind          = "entry"
main          = "src/entry/main.cpp"
test-protocol = 1
test-main     = true
test-guide    = "docs/writing-tests.md"
# What the library implements of the mcpp test spec's optional capabilities (mcpp
# docs/specs/test.md, B6), and the session a client starts (O9, `mtest serve`).
test-capabilities = ["check-details", "metrics", "scheduling", "fixtures", "usage", "output", "session"]
test-session      = ["mtest", "serve"]

[dependencies]
# A range, not one release: the library is in the test graph of every package
# that uses it, mcpplibs.os among them, whose tests build it against the os under
# test (mcpp 2026.11.9.1), and a package pins its own os.
mcpplibs.os   = "^0.4.1"
nlohmann.json = "3.12.0"
