# mtest: a test system for the agent era -- a protocol (spec/), a C++ test
# library (lib/, mcpplibs.mtest), an engine that runs, schedules, stores and
# analyses tests (engine/, the `mtest` program), adapters for other frameworks
# (adapters/), a C ABI for other languages (capi/), and the protocol's
# conformance suite (conformance/). Each part is used alone or with the others.
[workspace]
members = [
    "lib",
    "manifest",
    "conformance",
    "engine",
    "adapters/gtest",
    "capi",
]

[workspace.package]
mcpp = ">=2026.11.7.2"

# As mcpp itself builds: GCC on Linux, the xlings LLVM on macOS and Windows; a
# target whose platform states its toolchain (`<arch>-openkal`) takes the platform's.
[workspace.target.'cfg(linux)']
toolchain = "gcc@16.1.0"

[workspace.target.'cfg(macos)']
toolchain = "llvm@23.1.3"

[workspace.target.'cfg(windows)']
toolchain = "llvm@23.1.3"

[workspace.target.'cfg(os = "openkal")']
platform = "openkal-platform@0.25.0"
